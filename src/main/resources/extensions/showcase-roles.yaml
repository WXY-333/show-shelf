apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-showcase-view
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "展示架"
    rbac.authorization.halo.run/display-name: "展示架查看"
    rbac.authorization.halo.run/ui-permissions: '["plugin:showcase:view"]'
rules:
  - apiGroups:
      - api.showcase.halo.run
    resources:
      - items
      - categories
      - subcategories
      - settings
    verbs:
      - get
      - list
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/items
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/categories
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/catalog
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/page
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/stats
      - /apis/api.showcase.halo.run/v1alpha1/public/items
      - /apis/api.showcase.halo.run/v1alpha1/public/categories
      - /apis/api.showcase.halo.run/v1alpha1/public/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/public/catalog
      - /apis/api.showcase.halo.run/v1alpha1/public/page
      - /apis/api.showcase.halo.run/v1alpha1/public/stats
      - /apis/api.showcase.halo.run/v1alpha1/items
      - /apis/api.showcase.halo.run/v1alpha1/categories
      - /apis/api.showcase.halo.run/v1alpha1/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/settings
      - /apis/api.showcase.halo.run/v1alpha1/admin/items
      - /apis/api.showcase.halo.run/v1alpha1/admin/categories
      - /apis/api.showcase.halo.run/v1alpha1/admin/subcategories
    verbs: ["get"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  # Keep the 1.6.1 role name so Halo updates the already-installed role on
  # upgrade.  The separate v1 role below covers installations where the old
  # resource was removed or was never created.
  name: role-template-showcase-anonymous
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
rules:
  # CustomEndpoint paths under /apis/{group}/{version}/public/v1/{name} are
  # parsed by Halo as resource=public and subresource={name}; authorize them
  # as API resources rather than nonResourceURLs.
  - apiGroups:
      - api.showcase.halo.run
    resources:
      - public
      - public/items
      - public/categories
      - public/subcategories
      - public/catalog
      - public/page
      - public/stats
    verbs:
      - get
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/items
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/categories
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/catalog
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/page
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/stats
      - /apis/api.showcase.halo.run/v1alpha1/public/items
      - /apis/api.showcase.halo.run/v1alpha1/public/categories
      - /apis/api.showcase.halo.run/v1alpha1/public/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/public/catalog
      - /apis/api.showcase.halo.run/v1alpha1/public/page
      - /apis/api.showcase.halo.run/v1alpha1/public/stats
    verbs: ["get"]
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/items/like
      - /apis/api.showcase.halo.run/v1alpha1/items/*/like
    verbs: ["create"]
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/stats
      - /apis/api.showcase.halo.run/v1alpha1/stats/visit
    verbs: ["get", "create"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-showcase-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "展示架"
    rbac.authorization.halo.run/display-name: "展示架管理"
    rbac.authorization.halo.run/ui-permissions: '["plugin:showcase:manage"]'
    rbac.authorization.halo.run/dependencies: '["role-template-showcase-view"]'
rules:
  - apiGroups:
      - api.showcase.halo.run
    resources:
      - items
      - categories
      - subcategories
      - settings
    verbs:
      - create
      - update
      - patch
      - delete
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/items
      - /apis/api.showcase.halo.run/v1alpha1/items/*
      - /apis/api.showcase.halo.run/v1alpha1/categories
      - /apis/api.showcase.halo.run/v1alpha1/categories/*
      - /apis/api.showcase.halo.run/v1alpha1/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/subcategories/*
      - /apis/api.showcase.halo.run/v1alpha1/settings
      - /apis/api.showcase.halo.run/v1alpha1/admin/items
      - /apis/api.showcase.halo.run/v1alpha1/admin/categories
      - /apis/api.showcase.halo.run/v1alpha1/admin/settings
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  # Use a new resource name so upgrades from 1.6.1 create and aggregate the
  # public API permissions even when Halo keeps the previously installed role.
  name: role-template-showcase-public-v1
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
rules:
  - apiGroups:
      - api.showcase.halo.run
    resources:
      - public
      - public/items
      - public/categories
      - public/subcategories
      - public/catalog
      - public/page
      - public/stats
    verbs:
      - get
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/items
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/categories
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/catalog
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/page
      - /apis/api.showcase.halo.run/v1alpha1/public/v1/stats
      - /apis/api.showcase.halo.run/v1alpha1/public/items
      - /apis/api.showcase.halo.run/v1alpha1/public/categories
      - /apis/api.showcase.halo.run/v1alpha1/public/subcategories
      - /apis/api.showcase.halo.run/v1alpha1/public/catalog
      - /apis/api.showcase.halo.run/v1alpha1/public/page
      - /apis/api.showcase.halo.run/v1alpha1/public/stats
    verbs: ["get"]
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/items/like
    verbs: ["create"]
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/stats
      - /apis/api.showcase.halo.run/v1alpha1/stats/visit
    verbs: ["get", "create"]
  - nonResourceURLs:
      - /apis/api.showcase.halo.run/v1alpha1/items/*/like
    verbs: ["create"]
